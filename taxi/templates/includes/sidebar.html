<hr>

<div class="sidebar-auth">
  {% if user.is_authenticated %}
    <p>
      {% if user.driver %}
        <a href="{% url 'taxi:driver-detail' user.driver.id %}">{{ user.username }}</a>
      {% else %}
        {{ user.username }}
      {% endif %}
    </p>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Logout</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}">Login</a>
  {% endif %}
</div>
